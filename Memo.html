<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>備忘錄</title>
    <link rel="stylesheet" href="recipe-login.css">
</head>
<body>

<div class="container">

    <h1>我的備忘錄</h1>

    <p class="note"> 
        <a href="log.php" class="link-btn"> 查看登入資料</a>
    </p>

    <form action="addMemo.php" method="post" enctype="multipart/form-data">

        <label>備忘內容</label>
        <textarea name="content" rows="4" required></textarea>

        <label>上傳圖片</label>
        <input type="file" name="image" accept="image/jpeg,image/png,image/gif">

        <button class="submit-btn" type="submit">新增備忘</button>

    </form>

    <hr>



    <div class="memo-list">

        <div class="memo-card"> 
            <form action="update.php" method="post" enctype="multipart/form-data">
                <input type="hidden" name="id" value="<!--ID-->">
                <textarea name="content"></textarea>
                <input type="file" name="image">
                <button class="submit-btn">修改</button>
            </form>

            <form action="delete.php" method="post">
                <input type="hidden" name="id" value="<!--ID-->">
                <button class="submit-btn">刪除</button>
            </form>
        </div>

    </div>

    </div>

</div>

</body>
</html>
